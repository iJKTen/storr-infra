AWSTemplateFormatVersion: 2010-09-09
Description: Storr frontend - S3 website bucket, CloudFront distribution, DNS

Parameters:
  DomainName:
    Type: String
    Default: app.storr.build
    Description: Fully qualified domain name for the frontend
  ApiDomain:
    Type: String
    Default: api.storr.build
    Description: API domain used in CSP connect-src header

Resources:

  # --- S3 Website Bucket ---

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AutoCleanupOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: storr

  # --- Website Bucket Cleanup on Stack Deletion ---

  EmptyWebsiteBucketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/storr-empty-website-bucket
      RetentionInDays: 7

  EmptyWebsiteBucketRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Sub '${AWS::AccountId}'
      Policies:
        - PolicyName: EmptyBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt WebsiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub '${WebsiteBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${EmptyWebsiteBucketLogGroup.Arn}:*'

  EmptyWebsiteBucketFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt EmptyWebsiteBucketRole.Arn
      LoggingConfig:
        LogGroup: !Ref EmptyWebsiteBucketLogGroup
      Code:
        ZipFile: |
          const { S3Client, ListObjectVersionsCommand, DeleteObjectsCommand } = require("@aws-sdk/client-s3");
          const https = require("https");
          const url = require("url");

          function sendResponse(event, context, status, reason) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason || `See CloudWatch Log Stream: ${context.logStreamName}`,
              PhysicalResourceId: context.logStreamName,
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
            });
            const parsed = url.parse(event.ResponseURL);
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: parsed.hostname,
                port: 443,
                path: parsed.path,
                method: "PUT",
                headers: { "Content-Type": "", "Content-Length": body.length },
              }, (res) => resolve());
              req.on("error", reject);
              req.write(body);
              req.end();
            });
          }

          exports.handler = async (event, context) => {
            if (event.RequestType !== "Delete") {
              return sendResponse(event, context, "SUCCESS");
            }
            try {
              const bucket = event.ResourceProperties.BucketName;
              const s3 = new S3Client();
              let keyMarker, versionIdMarker;
              do {
                const resp = await s3.send(new ListObjectVersionsCommand({
                  Bucket: bucket, KeyMarker: keyMarker, VersionIdMarker: versionIdMarker,
                }));
                const objects = [];
                for (const v of (resp.Versions || [])) objects.push({ Key: v.Key, VersionId: v.VersionId });
                for (const m of (resp.DeleteMarkers || [])) objects.push({ Key: m.Key, VersionId: m.VersionId });
                if (objects.length > 0) {
                  await s3.send(new DeleteObjectsCommand({ Bucket: bucket, Delete: { Objects: objects, Quiet: true } }));
                }
                keyMarker = resp.IsTruncated ? resp.NextKeyMarker : undefined;
                versionIdMarker = resp.IsTruncated ? resp.NextVersionIdMarker : undefined;
              } while (keyMarker);
              return sendResponse(event, context, "SUCCESS");
            } catch (e) {
              console.error("Error emptying bucket:", e);
              return sendResponse(event, context, "FAILED", e.message);
            }
          };

  EmptyWebsiteBucketOnDelete:
    Type: Custom::EmptyS3Bucket
    DependsOn: EmptyWebsiteBucketLogGroup
    Properties:
      ServiceToken: !GetAtt EmptyWebsiteBucketFunction.Arn
      BucketName: !Ref WebsiteBucket

  # --- Bucket Policy ---

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt WebsiteBucket.Arn
              - !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # --- CloudFront ---

  CloudFrontOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: !Sub 'OAC for ${DomainName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://${ApiDomain}; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
        ViewerCertificate:
          AcmCertificateArn: '{{resolve:ssm:/storr/acm/cert-arn}}'
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # --- DNS ---

  DomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: '{{resolve:ssm:/storr/acm/hosted-zone-id}}'
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DomainRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: '{{resolve:ssm:/storr/acm/hosted-zone-id}}'
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # --- SSM Parameters ---

  CloudFrontDistributionIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /storr/cloudfront/distribution-id
      Type: String
      Value: !Ref CloudFrontDistribution

  CloudFrontDomainNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /storr/cloudfront/domain-name
      Type: String
      Value: !GetAtt CloudFrontDistribution.DomainName

  WebsiteBucketNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /storr/s3/website-bucket-name
      Type: String
      Value: !Ref WebsiteBucket
